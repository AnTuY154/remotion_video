name: Render Đời yarn demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/character-video/**"
      - "!packages/character-video/renders/**"
      - ".github/workflows/render-doi-demo.yml"

permissions:
  contents: write

concurrency:
  group: render-doi-demo
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install dependencies
        run: bun install

      - name: Render MP4
        working-directory: packages/character-video
        run: |
          mkdir -p renders
          bunx remotion render src/index.ts DoiYarnDemo renders/doi-yarn-demo.mp4 --codec=h264 --overwrite --concurrency=2

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: doi-yarn-demo
          path: packages/character-video/renders/doi-yarn-demo.mp4
          if-no-files-found: error

      - name: Commit rendered MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/character-video/renders/doi-yarn-demo.mp4
          if git diff --cached --quiet; then
            echo "Render unchanged; nothing to commit."
          else
            git commit -m "chore(video): render Đời yarn demo"
            git push
          fi
