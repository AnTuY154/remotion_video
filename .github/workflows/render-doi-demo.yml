name: Render Đời yarn demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/character-video/**"
      - "!packages/character-video/renders/**"
      - "!packages/character-video/public/assets/doi-v2.webp"
      - ".github/workflows/render-doi-demo.yml"

permissions:
  contents: write

concurrency:
  group: render-doi-demo
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Materialize Đời V2 asset
        run: |
          bun packages/character-video/scripts/materialize-assets.ts
          test -s packages/character-video/public/assets/doi-v2.webp
          file packages/character-video/public/assets/doi-v2.webp

      - name: Prepare standalone Remotion runner
        run: |
          rm -rf .render-runner
          mkdir -p .render-runner
          cp -R packages/character-video/src .render-runner/src
          cp -R packages/character-video/public .render-runner/public
          cat > .render-runner/package.json <<'JSON'
          {
            "private": true,
            "dependencies": {
              "@remotion/cli": "4.0.524",
              "react": "19.2.3",
              "react-dom": "19.2.3",
              "remotion": "4.0.524"
            }
          }
          JSON
          cd .render-runner
          bun install

      - name: Render MP4
        run: |
          mkdir -p packages/character-video/renders
          cd .render-runner
          bunx remotion render src/index.ts DoiYarnDemo ../packages/character-video/renders/doi-yarn-demo.mp4 --codec=h264 --overwrite --concurrency=2

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: doi-yarn-demo-v2
          path: packages/character-video/renders/doi-yarn-demo.mp4
          if-no-files-found: error

      - name: Commit materialized asset and rendered MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/character-video/public/assets/doi-v2.webp
          git add packages/character-video/renders/doi-yarn-demo.mp4
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "chore(video): render Đời V2 yarn demo"
            git push
          fi
