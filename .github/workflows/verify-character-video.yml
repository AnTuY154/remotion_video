name: Verify character video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/character-video/**"
      - "bun.lock"
      - ".github/workflows/verify-character-video.yml"
      - "!packages/character-video/renders/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Verify frozen lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck character-video
        working-directory: packages/character-video
        run: bunx tsc --noEmit
